name: Build Faiths AI IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Creates package.json if it is missing in the root directory
      - name: Initialize package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found! Initializing default project configuration..."
            npm init -y
          fi

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      # FIX: Added --no-link to prevent it from auto-running pod install too early
      - name: Initialize Native iOS Scaffold
        run: |
          npx cap init "Faiths AI" "com.faith.ai" --web-dir=public
          npx cap add ios --no-link

      # FIX: Modifies the target version inside BOTH the Podfile and the Capacitor target
      - name: Force Modern iOS Deployment Target
        run: |
          sed -i '' "s/platform :ios, '.*/platform :ios, '14.0'/g" ios/App/Podfile
          echo "Updated Podfile platform target to iOS 14.0"

      # FIX: Manually triggers the dependency installer now that the version target is correct
      - name: Install Native iOS Dependencies
        run: |
          cd ios/App
          pod install

      - name: Bundle Web Assets
        run: |
          npx cap sync ios

      - name: Compile Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO

      - name: Package Build into .ipa
        run: |
          mkdir -p build/ios/ipa
          cd ios/App/build/Release-iphoneos
          zip -r ../../../../build/ios/ipa/FaithsAI.ipa App.app

      - name: Upload Completed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faiths-AI-Installer
          path: build/ios/ipa/FaithsAI.ipa
