name: Build Faiths AI IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Ensure Public Folder Exists
        run: |
          mkdir -p public

          if [ ! -f public/index.html ]; then
            echo "<h1>Faiths AI</h1>" > public/index.html
          fi

      - name: Add iOS Platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Force iOS 15 Deployment Target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build App
        run: |
          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R ios/App/build/Release-iphoneos/App.app Payload

          mkdir -p build
          zip -r build/FaithsAI.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FaithsAI
          path: build/FaithsAI.ipa
