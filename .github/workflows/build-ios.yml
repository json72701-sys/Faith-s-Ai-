name: Build Faiths AI IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # FIX STEP: Dynamically creates package.json if it's missing in the root directory
      - name: Initialize package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found! Initializing default project configuration..."
            npm init -y
          fi

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Initialize Native iOS Scaffold
        run: |
          npx cap init "Faiths AI" "com.faith.ai" --web-dir=public --noprompt
          npx cap add ios

      - name: Bundle Web Assets
        run: |
          npx cap sync ios

      - name: Compile Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO

      - name: Package Build into .ipa
        run: |
          mkdir -p build/ios/ipa
          cd ios/App/build/Release-iphoneos
          zip -r ../../../../build/ios/ipa/FaithsAI.ipa App.app

      - name: Upload Completed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faiths-AI-Installer
          path: build/ios/ipa/FaithsAI.ipa
