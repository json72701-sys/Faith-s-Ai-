name: Build Faiths AI IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Creates package.json if it is missing in the root directory
      - name: Initialize package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found! Initializing default project configuration..."
            npm init -y
          fi

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      # Pre-builds the directory structure and drops our custom iOS 14 Podfile inside
      - name: Pre-scaffold iOS Target Directory and Podfile
        run: |
          mkdir -p ios/App
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '14.0'
          use_frameworks!

          target 'App' do
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          EOF
          echo "Pre-emptive iOS 14 Podfile deployed successfully."

      # Initialize only the base configuration settings file
      - name: Initialize Capacitor Config
        run: |
          npx cap init "Faiths AI" "com.faith.ai" --web-dir=public

      # FIX: Run sync directly instead of add, so it doesn't crash on the existing folder
      - name: Bundle Web Assets and Sync Native Dependencies
        run: |
          npx cap sync ios

      # Manually trigger the dependency installation with our clean custom Podfile
      - name: Install Native iOS Dependencies via CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Compile Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO

      - name: Package Build into .ipa
        run: |
          mkdir -p build/ios/ipa
          cd ios/App/build/Release-iphoneos
          zip -r ../../../../build/ios/ipa/FaithsAI.ipa App.app

      - name: Upload Completed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faiths-AI-Installer
          path: build/ios/ipa/FaithsAI.ipa
