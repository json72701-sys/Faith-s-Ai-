name: Build Faiths AI IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Creates package.json if it is missing in the root directory
      - name: Initialize package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found! Initializing default project configuration..."
            npm init -y
          fi

      - name: Install Project Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      # Step 1: Initialize the base configuration setting
      - name: Initialize Capacitor Config
        run: |
          npx cap init "Faiths AI" "com.faith.ai" --web-dir=public

      # Step 2: Let Capacitor build its actual, raw Xcode structures safely
      - name: Build Xcode Base Project Structure
        run: |
          npx cap add ios
        continue-on-error: true # This will bypass the old CocoaPods version target crash!

      # Step 3: Now that the .xcodeproj exists, force-inject our modern iOS 14 Podfile layout
      - name: Patch Native iOS Deployment Target
        run: |
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '14.0'
          use_frameworks!

          target 'App' do
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end
          EOF
          echo "Podfile patched successfully with iOS 14.0 and native Xcode tracking."

      # Step 4: Run the asset sync to make sure your web UI is copied in perfectly
      - name: Sync Frontend Web Assets
        run: |
          npx cap sync ios

      # Step 5: Run the native dependency installer now that both the Xcode files and the Podfile match!
      - name: Install Native iOS Dependencies via CocoaPods
        run: |
          cd ios/App
          pod install

      # Step 6: Compile the complete project bundle
      - name: Compile Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos clean build CODE_SIGNING_ALLOWED=NO

      # Step 7: Zip everything up into your installable mobile application
      - name: Package Build into .ipa
        run: |
          mkdir -p build/ios/ipa
          cd ios/App/build/Release-iphoneos
          zip -r ../../../../build/ios/ipa/FaithsAI.ipa App.app

      - name: Upload Completed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Faiths-AI-Installer
          path: build/ios/ipa/FaithsAI.ipa
